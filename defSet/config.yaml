# Meta-Plugin 配置模板
# 锅巴保存时读取本文件，把 ${变量} 替换为表单值后写入 config/config.yaml
# 不用锅巴也可以：首次启动会自动从 config/config.yaml.example 复制一份运行时配置

# 常规查询命令的优先级（数字越小越先执行，默认 8000）
# ⚠ 攻略模块的「抢占用」优先级写死在代码里（-100000，早于 Atlas 快捷入口），不在此处暴露
priority: ${meta_priority}

# 渲染缩放比例（越大越清晰、渲染越慢）
renderScale: ${meta_renderScale}

# ---------- 模块开关（功能层：该模块的命令是否响应） ----------
# true = 可用；false = 不响应
#   非接管类（#DPS… / 练度 / 队伍伤害…）：回一条"已在配置中关闭"的提示
#   接管类（#胡桃攻略 / 帮助页）：本插件不认领，放行给 genshin「米游社攻略」/ Atlas
# ⚠ 与 networkEnabled（只管查询类远程访问）正交：模块开着而联网关时，命令照常响应、只是不发远程请求
modules:
  codex: ${meta_module_codex}
  help: ${meta_module_help}
  rank: ${meta_module_rank}
  raidTiers: ${meta_module_raidTiers}
  grade: ${meta_module_grade}
  # 队伍伤害：默认关闭（用户 2026-10-15 定）
  teamDamage: ${meta_module_teamDamage}
  video: ${meta_module_video}
  status: ${meta_module_status}
  admin: ${meta_module_admin}

# ---------- 业务查询联网开关（查询联网层） ----------
# 默认关闭。**只**管辖 DPS 榜 / 危战 / 练度等业务查询的远程访问与刷新
# （mhydps / miao 面板 / 队伍 / 榜单头像下载）；关闭时这些请求一律不发，攻略查询完全离线。
# ⚠ 它**不是**整个插件的全局联网禁令：别名服务、可选插件探测、依赖安装等其他网络操作不受它限制
networkEnabled: ${meta_networkEnabled}

# ---------- 数据源 · mhydps.cn（DPS榜 / 危战榜） ----------
# 抓取 mhydps.cn 使用的代理，留空 = 直连
# 实测国内直连 www.mhydps.cn 会被重置（TLS 握手阶段 RST），通常需要本地代理
proxy: "${meta_proxy}"

# 榜单单次请求超时（毫秒）
dpsTimeoutMs: ${meta_dpsTimeoutMs}

# 榜单数据缓存有效期（分钟）
dpsCacheTtlMinutes: ${meta_dpsCacheTtlMinutes}

# 榜单每页条数
dpsPageSize: ${meta_dpsPageSize}

# 是否缓存并渲染角色立绘
dpsAvatarEnabled: ${meta_dpsAvatarEnabled}

# 练度评分权重（综合 / 武器 / 天赋；只对攻略里有目标的维度加权）
# 「综合」= 圣遗物有效词条（miao 评分规则）为主 + 套装符合度，面板目标不计分
# 兼容旧写法：写 panel + artifact 会自动相加折进 comprehensive
gradeWeights: "${meta_gradeWeights}"

# 面板三档阈值：大毕业 / 毕业 / 小毕业（按面板目标平均达成度）
gradePanelTiers: "${meta_gradePanelTiers}"

# 总体练度九档阈值（MAX/ACE/SSS/SS/S/A/B/C，低于最后一项记 D）
gradeRankThresholds: "${meta_gradeRankThresholds}"

# ---------- 练度评分规则（2026-10-27：直接用 miao 面板当前激活的评分规则） ----------
# auto = 读 miao 面板「评分规则」的属性权重（charWeight），按输出向占比自动分档（推荐）
# 也可强制整站按某套规则（回退用）：dps / subdps / support
gradeRule: "${meta_gradeRule}"

# 逐角色覆盖（部署侧临时纠偏，优先级最高）：胡桃:dps,钟离:support
# ⚠ 长期口径请改 miao 里该角色的评分规则（artis_user.js），本项只作逃生阀
gradeRuleOverrides: "${meta_gradeRuleOverrides}"

# ---------- 队伍伤害（序号轴） ----------
# 写法：`序号:名称=轴定义`，多个轴用逗号分隔；轴定义 = 关键词×次数@窗口s（多段用 +，关键词对 miao 伤害行标题包含匹配）
# 查询：#队伍伤害2 胡桃 行秋 夜兰 钟离 —— 序号省略 = 1；词条直接写（暴击+20），不用加「词条:」
# `默认` 或留空 = 保守轴（每位队员取自己伤害最高的 1 行 ×1，窗口 20s）
teamDamageAxes: "${meta_teamDamageAxes}"
